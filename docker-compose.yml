services:

  # ─────────────────────────────────────────────
  # VPN GATEWAY — all torrent traffic routes through here
  # ─────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      # only connect to servers that support NAT-PMP port forwarding
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      # push the forwarded port into qBittorrent (shares this netns) whenever it changes
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      - DNS_KEEP_NAMESERVER=on
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - FIREWALL_INPUT_PORTS=8080,8888
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16
      - FIREWALL=on
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      - 8080:8080
    # Declared here to override the image's default start_period of 10s, which
    # is far shorter than a cold ProtonVPN WireGuard handshake + NAT-PMP lease.
    # With the default, Docker marked Gluetun *unhealthy* ~25s into a restart;
    # Compose treats an unhealthy dependency as a hard abort rather than
    # something to keep waiting on, so every service gated on
    # `condition: service_healthy` (qbittorrent, mylar3, shelfmark) was skipped
    # and never retried, even though Gluetun went healthy moments later. That
    # silently killed the download stack after the weekly backup on 2026-09-06
    # and again on 2026-09-13. Failures inside start_period do not mark the
    # container unhealthy, so Compose waits instead of giving up.
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    # unless-stopped, not on-failure:N. qBittorrent shares this container's
    # network namespace, and Prowlarr, Mylar3 and Shelfmark all egress through
    # its HTTP proxy, so a Gluetun that gives up after N failures takes the
    # whole download stack down until someone notices. Keep retrying instead.
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # TORRENT CLIENT — shares Gluetun's network namespace
  # ─────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - UMASK=002
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/jellyfin:/data
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # CLOUDFLARE BYPASS — required for Cloudflare-protected indexers
  # Prowlarr talks to this automatically when an indexer needs it
  # ─────────────────────────────────────────────
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - PORT=8191
      - HTTP_PROXY=http://gluetun:8888
      - HTTPS_PROXY=http://gluetun:8888
      - NO_PROXY=localhost,127.0.0.1
    ports:
      - 8191:8191
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # INDEXER MANAGER — distributes indexers to all *arr services
  # ─────────────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - HTTP_PROXY=http://gluetun:8888
      - HTTPS_PROXY=http://gluetun:8888
      - NO_PROXY=localhost,127.0.0.1,gluetun,sonarr,radarr,mylar3,flaresolverr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # TV AUTOMATION
  # ─────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/sonarr:/config
      - /mnt/jellyfin:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MOVIE AUTOMATION
  # ─────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/radarr:/config
      - /mnt/jellyfin:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MEDIA REQUEST PORTAL
  # ─────────────────────────────────────────────
  # Seerr — the merged successor to Jellyseerr and Overseerr, renamed upstream
  # in 2025. fallenbagel/jellyseerr is a dead end: its newest tag on either
  # registry is 2025-10-06 and both stop at 2.7.3, which is what ran here until
  # 2026-09-18. Config migrates automatically on first start and the migration
  # is ONE-WAY; the 2.7.3 config is archived at
  # ~/jellyseerr-2.7.3-config-20260918-143030.tar.gz.
  #
  # The service and container deliberately keep the 'jellyseerr' name so nothing
  # else has to change. NPM forwards to 172.17.0.1:5055 by IP, not by container
  # name, so the reverse proxy is unaffected either way.
  #
  # init: true is REQUIRED — the Seerr image no longer ships an init process.
  #
  # Seerr runs as the non-root 'node' user (uid 1000) where Jellyseerr ran as
  # root, so ./config/jellyseerr must be owned 1000:1000 or the first write
  # fails. It was root-owned; chowned during the migration.
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # SUBTITLE MANAGER
  # ─────────────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/bazarr:/config
      - "/mnt/jellyfin/Movies:/movies"
      - "/mnt/jellyfin/TV Shows:/tv"
      - "/mnt/jellyfin/Anime:/anime"
      - /mnt/jellyfin:/data
    ports:
      - 6767:6767
    restart: unless-stopped

  # ═════════════════════════════════════════════
  # LITERATURE STACK
  # ═════════════════════════════════════════════

  # EBOOK + AUDIOBOOK SEARCH AND DOWNLOAD
  # Replaces the retired Readarr (previously run here as the 'bookshelf'
  # service, which was Readarr itself despite the name). Search-and-download
  # front end: finds releases, hands torrents to qBittorrent, then files the
  # finished book into the library folder Kavita already scans.
  #
  # Uses the '-lite' image variant deliberately: the standard image bundles its
  # own Chromium for Cloudflare bypass (upstream advises ~2GB RAM for it), which
  # is wasteful on a Pi when Byparr is already running for exactly that job.
  # EXT_BYPASSER_URL points it at Byparr instead.
  #
  # Outbound traffic goes through gluetun's HTTP proxy, same pattern as
  # prowlarr and flaresolverr, rather than sharing gluetun's netns.
  shelfmark:
    image: ghcr.io/calibrain/shelfmark-lite:1.3.9
    container_name: shelfmark
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # ebooks land where Kavita's Books library points; audiobooks go to the
      # folder Audiobookshelf serves
      - INGEST_DIR=/data/Books
      - DESTINATION_AUDIOBOOK=/data/Audiobooks
      - USING_EXTERNAL_BYPASSER=true
      - EXT_BYPASSER_URL=http://flaresolverr:8191
      - PROXY_MODE=http
      - HTTP_PROXY=http://gluetun:8888
      - HTTPS_PROXY=http://gluetun:8888
      - NO_PROXY=localhost,127.0.0.1,gluetun,prowlarr,flaresolverr
    volumes:
      - ./config/shelfmark:/config
      - /mnt/jellyfin:/data
    ports:
      - 8084:8084
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # COMIC + MANGA + MAGAZINE AUTOMATION
  # Equivalent of Sonarr/Radarr for comics and periodicals.
  # Connects to Prowlarr for indexers, qBittorrent for downloads.
  #
  # Outbound traffic goes through gluetun's HTTP proxy, same pattern as
  # prowlarr, flaresolverr and shelfmark. This matters because DDL is enabled:
  # with DDL, mylar3 fetches comic files itself rather than handing them to
  # qBittorrent, so without this it would download on the real WAN IP.
  # Mylar3's own enable_proxy setting is NOT sufficient: only getcomics.py and
  # pixeldrain.py honour it, while mediafire.py and 20 other modules do not.
  # Setting the proxy at the container level covers every module, because both
  # requests and urllib.request read these variables automatically.
  # Lowercase duplicates are intentional (urllib prefers lowercase).
  mylar3:
    # Pinned. Mylar3's behaviour here is tuned in detail (provider order with
    # DDL first, file renaming, pack handling, proxy egress) and an unattended
    # 'latest' pull could silently change any of it. Bump deliberately.
    image: lscr.io/linuxserver/mylar3:v0.10.0-ls262
    container_name: mylar3
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - HTTP_PROXY=http://gluetun:8888
      - HTTPS_PROXY=http://gluetun:8888
      - http_proxy=http://gluetun:8888
      - https_proxy=http://gluetun:8888
      # internal services must bypass the proxy: qbittorrent lives inside
      # gluetun's netns and is reached as gluetun:8080
      - NO_PROXY=localhost,127.0.0.1,gluetun,prowlarr,flaresolverr,qbittorrent
      - no_proxy=localhost,127.0.0.1,gluetun,prowlarr,flaresolverr,qbittorrent
    volumes:
      - ./config/mylar3:/config
      - /mnt/jellyfin:/data
    ports:
      - 8090:8090
    # Mylar3's entire egress path is gluetun's proxy, so wait for it on a cold
    # boot the same way shelfmark does. Without this Mylar3 can start first and
    # its early outbound calls fail. It fails closed rather than leaking (with
    # HTTP_PROXY set and the proxy unreachable, requests and urllib raise rather
    # than going direct), so this is about avoiding noise, not plugging a leak.
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # AUDIOBOOK SERVER + MOBILE APP BACKEND
  # Has a first-party iOS/Android app. Also handles podcasts.
  # Does NOT use PUID/PGID — manages permissions internally.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
    volumes:
      - /mnt/jellyfin/Audiobooks:/audiobooks
      - /mnt/jellyfin/Books:/ebooks
      - ./config/audiobookshelf:/config
      - ./config/audiobookshelf/metadata:/metadata
    ports:
      - 13378:80
    restart: unless-stopped

  # EBOOK + COMIC + MANGA READING SERVER
  # Unified reader for all visual/text content. Supports OPDS
  # (allows any e-reader app to connect if you get a device later).
  # Does NOT use PUID/PGID — manages permissions internally.
  kavita:
    image: jvmilazz0/kavita:0.9.0.2
    container_name: kavita
    environment:
      - TZ=${TZ}
    volumes:
      - /mnt/jellyfin/Books:/books
      - /mnt/jellyfin/Comics:/comics
      - /mnt/jellyfin/Magazines:/magazines
      - ./config/kavita:/kavita/config
    ports:
      - 5000:5000
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # REVERSE PROXY — routes external traffic to internal services
  # ─────────────────────────────────────────────
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    network_mode: host
    volumes:
      - ./config/npm/data:/data
      - ./config/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
